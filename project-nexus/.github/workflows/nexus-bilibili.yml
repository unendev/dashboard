name: Nexus Bilibili Crawler

on:
  # schedule:
  #   - cron: '0 */2 * * *' # Run every 2 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  crawl-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Crawler
        env:
          NEXUS_API_URL: ${{ secrets.NEXUS_API_URL }}
          NEXUS_INGEST_KEY: ${{ secrets.NEXUS_INGEST_KEY }} # Use SUPER_ADMIN_KEY
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
        run: node scripts/crawl-bilibili.cjs
