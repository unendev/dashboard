name: 小黑盒爬虫定时任务

on:
  push:
    branches:
      - master
  schedule:
    # 每天 UTC 16:00 运行（北京时间 00:00，凌晨）
    - cron: '0 16 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  scrape-heybox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-nexus/linuxdo-scraper

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            project-nexus/linuxdo-scraper/requirements.txt

      - name: 安装依赖
        run: |
          echo "pwd=$(pwd)"
          if [ -f requirements.txt ]; then
            echo "使用 requirements.txt 安装依赖"
            pip install -r requirements.txt
          else
            echo "requirements.txt 不存在，回退到 README 依赖安装（仅 CI 兜底）"
            sed -n '/^pip install /p' README.md | sed 's/^pip install //g' | tr ' ' '\n' | sed '/^$/d' > .ci-fallback-requirements.txt
            cat .ci-fallback-requirements.txt
            pip install -r .ci-fallback-requirements.txt
          fi

      - name: 安装Playwright浏览器
        run: |
          echo "pwd=$(pwd)"
          python -m playwright install chromium

      - name: 运行小黑盒爬虫
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEYBOX_TOKEN_ID: ${{ secrets.HEYBOX_TOKEN_ID }}
          AI_PROVIDER: gemini
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_PROXY_API_KEY: ${{ secrets.GEMINI_PROXY_API_KEY }}
          GEMINI_MODEL: gemini-3-flash
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_ACTIONS: true
        run: |
          echo "pwd=$(pwd)"
          cd heybox_scraper
          python heybox_playwright_scraper.py

      # 注意：数据已存入数据库，前端直接从数据库读取
      # 不需要提交 JSON 文件到 GitHub
