name: 小黑盒爬虫定时任务

on:
  push:
    branches:
      - master
  schedule:
    # 每天 UTC 16:00 运行（北京时间 00:00，凌晨）
    - cron: '0 16 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  scrape-heybox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-nexus/linuxdo-scraper

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          echo "pwd=$(pwd)"
          echo "repo root files:"
          ls -la
          echo "check scraper dir:"
          ls -la project-nexus/linuxdo-scraper || true
          echo "requirements exists?"
          test -f project-nexus/linuxdo-scraper/requirements.txt && echo "yes" || echo "no"
          python -m pip install --upgrade pip
          pip install \
            playwright \
            requests \
            python-dotenv \
            asyncpg \
            psycopg2-binary \
            openai \
            google-generativeai \
            beautifulsoup4 \
            lxml \
            tqdm \
            aiohttp \
            asyncio-throttle \
            praw \
            DrissionPage

      - name: 安装Playwright浏览器
        run: |
          echo "pwd=$(pwd)"
          python -m playwright install chromium

      - name: 运行小黑盒爬虫
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEYBOX_TOKEN_ID: ${{ secrets.HEYBOX_TOKEN_ID }}
          AI_PROVIDER: gemini
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_PROXY_API_KEY: ${{ secrets.GEMINI_PROXY_API_KEY }}
          GEMINI_MODEL: gemini-3-flash
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_ACTIONS: true
        run: |
          echo "pwd=$(pwd)"
          cd heybox_scraper
          python heybox_playwright_scraper.py

      # 注意：数据已存入数据库，前端直接从数据库读取
      # 不需要提交 JSON 文件到 GitHub
